services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: always
    # Qdrant starts 63 actix workers; each opens many FDs (mmap segments + sockets).
    # Default container nofile=1024 panics with "Too many open files" during startup
    # ("called Result::unwrap() on an Err: Os { code: 24 }" in actix-server worker.rs).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB=20000
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "grep -q '18BD' /proc/net/tcp || grep -q '18BD' /proc/net/tcp6"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  ollama:
    image: ollama/ollama:latest
    restart: always
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "grep -q '2CAA' /proc/net/tcp || grep -q '2CAA' /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 20G

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: /bin/bash
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: >
      -c "
        echo '[ollama-init] Waiting for Ollama...' &&
        until echo > /dev/tcp/ollama/11434 2>/dev/null; do sleep 2; done &&
        echo '[ollama-init] Pulling qwen3-embedding:8b...' &&
        ollama pull qwen3-embedding:8b &&
        echo '[ollama-init] Done.'
      "
    restart: "no"
    depends_on:
      ollama:
        condition: service_started

  mcp-vector:
    build: .
    restart: always
    expose:
      - "3100"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OLLAMA_URL=http://ollama:11434
      - EMBED_MODEL_CODE=qwen3-embedding:8b
      - EMBED_MODEL_TEXT=qwen3-embedding:8b
      - VECTOR_SIZE=4096
      - EMBED_DOC_INSTRUCTION_CODE=Represent this source code for retrieval
      - EMBED_DOC_INSTRUCTION_TEXT=Represent this text for retrieval
      - EMBED_QUERY_INSTRUCTION_CODE=Represent this query for retrieving relevant source code
      - EMBED_QUERY_INSTRUCTION_TEXT=Represent this query for retrieving relevant text
      - LOG_LEVEL=info
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - "traefik.enable=true"
      # Cloudflare proxy (orange-cloud) terminates TLS — origin receives plain HTTP
      - "traefik.http.routers.mcp-mcp-vector-memory.rule=Host(`vector.example.com`)"
      - "traefik.http.routers.mcp-mcp-vector-memory.entrypoints=web"
      - "traefik.http.services.mcp-mcp-vector-memory.loadbalancer.server.port=3100"
      # Security headers
      - "traefik.http.middlewares.mcp-radiank-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.mcp-radiank-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.mcp-radiank-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.mcp-radiank-bodylimit.buffering.maxRequestBodyBytes=204800"
      - "traefik.http.routers.mcp-mcp-vector-memory.middlewares=mcp-radiank-headers,mcp-radiank-bodylimit"
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  qdrant_data:
  ollama_data:
